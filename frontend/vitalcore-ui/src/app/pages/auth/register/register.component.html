<div class="auth-wrap">
  <div class="auth-card">
    <h2>Crear cuenta</h2>
    <p class="muted">Regístrate como paciente o doctor.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="mt-3">

      <label class="lbl">Tipo de cuenta</label>
      <select class="form-select input" formControlName="rol" (change)="onRoleChange($event)">
        <option *ngFor="let r of roles" [value]="r.value">{{ r.label }}</option>
      </select>

      <label class="lbl mt-3">Nombre</label>
      <input class="form-control input" formControlName="nombre" placeholder="Alejandro" />

      <label class="lbl mt-3">Apellido Paterno</label>
      <input class="form-control input" formControlName="apellidoPaterno" placeholder="Mendoza" />

      <label class="lbl mt-3">Apellido Materno</label>
      <input class="form-control input" formControlName="apellidoMaterno" placeholder="Hernandez" />

      <label class="lbl mt-3">Correo</label>
      <input class="form-control input" formControlName="correo" placeholder="correo@ejemplo.com" />

      <label class="lbl mt-3">Contraseña</label>
      <input class="form-control input" type="password" formControlName="password" placeholder="••••" />

      <div *ngIf="form.get('rol')?.value === 'PACIENTE'">
        <label class="lbl mt-3">Dirección</label>
        <input class="form-control input" formControlName="direccion" placeholder="Dirección completa" />

        <label class="lbl mt-3">Teléfono</label>
        <input class="form-control input" formControlName="telefono" placeholder="5555555555" />
      </div>
      <div *ngIf="form.get('rol')?.value === 'DOCTOR'">
        <label class="lbl mt-3">Especialidad</label>
        <input class="form-control input" formControlName="especialidad" placeholder="Especialidad" />

        <label class="lbl mt-3">Teléfono</label>
        <input class="form-control input" formControlName="telefono" placeholder="5555555555" />
      </div>

      <div class="err mt-3" *ngIf="error">{{ error }}</div>

      <button class="btn btn-vital w-100 mt-3" [disabled]="loading">
        {{ loading ? 'Creando...' : 'Crear cuenta' }}
      </button>
    </form>

    <div class="mt-3 text-center">
      <a routerLink="/login" class="link">Ya tengo cuenta</a>
    </div>
  </div>
</div>
