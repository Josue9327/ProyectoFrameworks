<div class="auth-wrap">
  <div class="auth-card">
    <h2>Iniciar sesión</h2>
    <p class="muted">Accede a VitalCore con tu correo.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="mt-3">
      <label class="lbl">Correo</label>
      <input class="form-control input" formControlName="correo" placeholder="correo@ejemplo.com" />
      <small class="err" *ngIf="correoCtrl?.touched && correoCtrl?.invalid">
        Ingresa un correo válido.
      </small>

      <label class="lbl mt-3">Contraseña</label>
      <input class="form-control input" type="password" formControlName="password" placeholder="••••" />
      <small class="err" *ngIf="passwordCtrl?.touched && passwordCtrl?.invalid">
        Mínimo 4 caracteres.
      </small>

      <div class="err mt-3" *ngIf="error">{{ error }}</div>

      <button class="btn btn-vital w-100 mt-3" [disabled]="loading">
        {{ loading ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <div class="mt-3 text-center">
      <a routerLink="/registro" class="link">Crear cuenta</a>
    </div>
  </div>
</div>
