<div class="home-container">
  <div style="width: 100%; display: flex; justify-content: left; padding-left: 15%;">
    <button pButton class="btn-create" type="button" (click)="enviarReportePorCorreo()">
      <i class="pi pi-send"></i>
    </button>
  </div>
  <div class="welcome">
    <h1><i class="fas fa-smile"></i> ¡Bienvenido, {{ paciente.nombre }}!</h1>
    <p>¿Cómo te gustaría comenzar hoy?</p>
  </div>

  <div class="cardx">
    <div class="grid">
      <div class="mini-card">
        <h3>Próxima Cita</h3>
        <p>{{ paciente.proximaCita || 'No programada' }}</p>
        <a routerLink="/paciente/citas" class="btn btn-vital">Ver citas</a>
      </div>

      <div class="mini-card">
        <h3>Recetas</h3>
        <a routerLink="/paciente/recetas" class="btn btn-vital">Ver recetas</a>
      </div>

      <div class="mini-card">
        <h3>Mi Perfil</h3>
        <p>Información personal</p>
        <a routerLink="/paciente/perfil" class="btn btn-vital">Editar perfil</a>
      </div>
</div>
