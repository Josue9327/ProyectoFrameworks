<div class="wrap">
    <div class="head">
        <h2 class="title">Mi Perfil</h2>
        <p class="muted">Información personal y antecedentes.</p>
    </div>

    <div class="grid-layout">
        <div class="cardx">
            <h3 class="sub">Datos Personales</h3>

            <div *ngIf="loading">Cargando...</div>

            <form *ngIf="!loading" [formGroup]="form" (ngSubmit)="save()">
                <div class="form-grid">
                    <div>
                        <label>Nombre</label>
                        <input formControlName="nombre" class="input">
                    </div>
                    <div>
                        <label>Apellido Paterno</label>
                        <input formControlName="appat" class="input">
                    </div>
                    <div>
                        <label>Apellido Materno</label>
                        <input formControlName="apmat" class="input">
                    </div>
                    <div>
                        <label>Fecha Nacimiento</label>
                        <input type="date" formControlName="fechaNacimiento" class="input">
                    </div>
                    <div class="full">
                        <label>Dirección</label>
                        <input formControlName="direccion" class="input">
                    </div>
                    <div>
                        <label>Correo</label>
                        <input formControlName="correo" class="input">
                    </div>
                    <div>
                        <label>Teléfono</label>
                        <input formControlName="telefono" class="input">
                    </div>
                </div>

                <div class="msgs">
                    <div class="err" *ngIf="error">{{ error }}</div>
                    <div class="success" *ngIf="success">{{ success }}</div>
                </div>

                <button class="btn btn-vital mt-3 w-100" [disabled]="saving">
                    {{ saving ? 'Guardando...' : 'Guardar Cambios' }}
                </button>
            </form>
        </div>

        <div class="cardx">
          <h3 class="sub">Historial Médico</h3>

          <div *ngIf="loading">Cargando...</div>

          <form *ngIf="!loading" [formGroup]="historialForm" (ngSubmit)="saveHistorial()">

            <div class="form-grid">
              <div class="full">
                <label>Alergias</label>
                <textarea class="input" rows="2" formControlName="alergias"></textarea>
              </div>

              <div class="full">
                <label>Enfermedades Crónicas</label>
                <textarea class="input" rows="2" formControlName="enfermedadesCronicas"></textarea>
              </div>

              <div class="full">
                <label>Adicciones</label>
                <textarea class="input" rows="2" formControlName="adicciones"></textarea>
              </div>

              <div class="full">
                <label>Discapacidades</label>
                <textarea class="input" rows="2" formControlName="discapacidades"></textarea>
              </div>
            </div>

            <div class="msgs">
              <div class="err" *ngIf="historialError">{{ historialError }}</div>
              <div class="success" *ngIf="historialSuccess">{{ historialSuccess }}</div>
            </div>

            <button class="btn btn-vital w-100 mt-3" [disabled]="historialSaving">
              {{ historialSaving ? 'Guardando...' : 'Guardar Historial' }}
            </button>
          </form>
        </div>
    </div>
</div>
