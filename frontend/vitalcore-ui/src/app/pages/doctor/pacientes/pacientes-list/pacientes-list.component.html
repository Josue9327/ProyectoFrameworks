<div class="page" style="padding: 20px 0 40px;">
  <div class="top" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 18px auto; width: min(1100px, calc(100% - 40px));">
    <div>
      <h2 class="title" style="color: #0a3d61; font-weight: 900; text-align: left; font-size: 36px;">Pacientes</h2>
      <p class="muted" style="color: #5c7d95; margin: 6px 0 0; text-align: center;">Gestión y consulta de pacientes registrados.</p>
    </div>

    <a *ngIf="filtered.length > 0" routerLink="/doctor/pacientes/nuevo" class="btn btn-vital" style="display: inline-block; background-color: #0a3d61; color: #fff; padding: 10px 20px; border-radius: 25px; font-weight: 600; text-decoration: none; transition: background-color 0.3s ease, transform 0.2s ease; text-transform: uppercase;">
      + Nuevo paciente
    </a>
  </div>

  <div *ngIf="filtered.length === 0" class="no-pacientes" style="display: flex; justify-content: center; align-items: center; flex-direction: column; margin-top: 30px; max-height: 20%;">
    <div class="message-container" style="background-color: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); text-align: center; width: 100%; max-width: 400px; display: flex; align-items: center; justify-content: center;">
      <i class="pi pi-info-circle message-icon" style="margin-right: 10px; font-size: 24px; color: #0a3d61;"></i>
      <p class="message" style="font-size: 22px; color: #333; margin: 0; font-weight: 600;">No hay pacientes disponibles.</p>
    </div>
    <button pButton class="btn-create" [routerLink]="'/doctor/pacientes/nuevo'" style="background-color: #0A3D61; color: #fff; padding: 10px 20px; border-radius: 30px; font-weight: 600; text-transform: uppercase; border: none; cursor: pointer; transition: background-color 0.3s ease, transform 0.2s ease; font-size: 16px; margin-top: 20px; width: 100%; max-width: 300px; display: flex; justify-content: center; align-items: center;">
      <i class="pi pi-plus" style="margin-right: 10px;"></i> Crear nuevo paciente
    </button>
  </div>

  <div *ngIf="filtered.length > 0" class="cardx" style="background-color: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); margin-top: 30px;">
    <div class="err" *ngIf="error" style="color: #d9534f; margin-top: 20px; text-align: center;">{{ error }}</div>

    <p-table
      [value]="filtered"
      [paginator]="true"
      [rows]="8"
      [loading]="loading"
      [rowsPerPageOptions]="[8,12,20]"
      responsiveLayout="scroll"
    >
      <ng-template pTemplate="header">
        <tr style="font-weight: 600; font-size: 14px; text-align: center; background-color: #f4f4f4;">
          <th>Nombre</th>
          <th>Correo</th>
          <th>Teléfono</th>
          <th style="width: 220px;">Acciones</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-p>
        <tr style="text-align: center; border-bottom: 1px solid #e3eef7;">
          <td style="font-size: 14px; color: #777; padding: 12px 15px;">
            <b>{{ p.nombre }}</b>
            <div class="muted small" style="color: #5c7d95; font-size: 12px;">{{ p.appat }} {{ p.apmat }}</div>
          </td>
          <td style="font-size: 14px; color: #777; padding: 12px 15px;">{{ p.correo || '-' }}</td>
          <td style="font-size: 14px; color: #777; padding: 12px 15px;">{{ p.telefono || '-' }}</td>
          <td class="actions" style="padding: 12px 15px;">
              <a class="btn btn-sm btn-outline-vital" [routerLink]="['/doctor/pacientes', p.idPaciente]" style="background-color: #fff; color: #0A3D61; padding: 8px 16px; border: 2px solid #0A3D61; border-radius: 30px; font-weight: 600; text-transform: uppercase; font-size: 14px; margin-right: 8px; transition: all 0.3s ease;">
                <i class="pi pi-eye" style="margin-right: 8px;"></i> Ver
              </a>
              <a class="btn btn-sm btn-outline-vital" [routerLink]="['/doctor/pacientes', p.idPaciente, 'editar']" style="background-color: #fff; color: #0A3D61; padding: 8px 16px; border: 2px solid #0A3D61; border-radius: 30px; font-weight: 600; text-transform: uppercase; font-size: 14px; margin-right: 8px; transition: all 0.3s ease;">
                <i class="pi pi-pencil" style="margin-right: 8px;"></i> Editar
              </a>
              <button class="btn btn-sm btn-danger" (click)="delete(p)" style="background-color: #d9534f; color: #fff; padding: 8px 16px; border-radius: 30px; font-weight: 600; text-transform: uppercase; border: none; cursor: pointer; transition: background-color 0.3s ease, transform 0.2s ease; font-size: 14px;">
                <i class="pi pi-trash" style="margin-right: 8px;"></i> Eliminar
              </button>

            </td>

        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<div style="margin-top: 20px; text-align: center;">
      <button class="btn btn-vital" style="display: inline-block; background-color: #0a3d61; color: #fff; padding: 10px 20px; border-radius: 25px; font-weight: 600; text-decoration: none; transition: background-color 0.3s ease, transform 0.2s ease; text-transform: uppercase;" (click)="generatePDF()">
        Generar Reporte PDF
      </button>
    </div>
