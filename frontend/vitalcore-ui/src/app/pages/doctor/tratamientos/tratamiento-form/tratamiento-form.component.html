<form [formGroup]="tratamientoForm" (ngSubmit)="saveTratamiento()" *ngIf="!loading">
  <div class="citas-form-wrap">
    <div class="citas-form-card">
      <h2>{{ tratamientoId ? 'Actualizar' : 'Crear' }} Tratamiento </h2>
      <div class="muted">Llena los detalles para crear o actualizar una cita.</div>
      <div class="form-group">
        <label for="diagnostico">Diagnóstico</label>
        <input formControlName="diagnostico" type="text" id="diagnostico" class="form-control" required>
      </div>

      <div class="form-group">
        <label for="idCita">Cita</label>
        <input formControlName="idCita" type="text" id="idCita" class="form-control" required>
      </div>

      <button type="submit" [disabled]="tratamientoForm.invalid" class="btn btn-primary">
        {{ tratamientoId ? 'Actualizar' : 'Crear' }} Tratamiento
      </button>
    </div>
  </div>
</form>
