<div class="page" style="padding: 20px 0 40px;">
  <div *ngIf="tratamientos.length > 0" style="display: flex; justify-content: right; max-width: 85%;">
    <button pButton [routerLink]="'/doctor/tratamientos/nuevo'"
      style="background-color: #0A3D61; color: #fff; padding: 8px 16px; font-weight: 600; text-transform: uppercase; border: none; border-radius: 30px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center;">
      <i class="pi pi-plus" style="margin-right: 8px;"></i> Nuevo Tratamiento
    </button>
  </div>
  <div class="title" style="color: #0a3d61; font-weight: 900; text-align: center; font-size: 36px;">
    <i class="pi pi-calendar" style="margin-right: 10px; font-size: 40px;"></i> Tratamientos
  </div>
  <div class="muted" style="color: #5c7d95; margin: 6px 0 0; text-align: center;">
    Gestión de tratamientos.
  </div>

  <div *ngIf="tratamientos.length === 0" class="no-recetas" style="display: flex; justify-content: center; align-items: center; flex-direction: column; margin-top: 30px; max-height: 20%;">
    <div class="message-container" style="background-color: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); text-align: center; width: 100%; max-width: 400px; display: flex; align-items: center; justify-content: center;">
      <i class="pi pi-info-circle message-icon" style="margin-right: 10px; font-size: 24px; color: #0a3d61;"></i>
      <p class="message" style="font-size: 22px; color: #333; margin: 0; font-weight: 600;">No hay tratamientos disponibles.</p>
    </div>
    <button pButton class="btn-create" [routerLink]="'/doctor/recetas/nueva'" style="background-color: #0A3D61; color: #fff; padding: 10px 20px; border-radius: 30px; font-weight: 600; text-transform: uppercase; border: none; cursor: pointer; transition: background-color 0.3s ease, transform 0.2s ease; font-size: 16px; margin-top: 20px; width: 100%; max-width: 300px; display: flex; justify-content: center; align-items: center;">
      <i class="pi pi-plus" style="margin-right: 10px;"></i> Crear nuevo tratamiento
    </button>
  </div>
  <div *ngIf="!loading">
    <p-table [value]="tratamientos" [paginator]="true" [rows]="10" [loading]="loading">
      <ng-template pTemplate="header">
        <tr style="font-weight: 600; font-size: 14px; text-align: center; background-color: #f4f4f4;">
          <th>Diagnóstico</th>
          <th>Acciones</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-tratamiento>
        <tr style="text-align: center; border-bottom: 1px solid #e3eef7;">
          <td style="font-size: 14px; color: #777; padding: 12px 15px;">{{ tratamiento.diagnostico }}</td>
          <td>
            <button pButton icon="pi pi-pencil" style="background-color: #0A3D61; color: #fff; padding: 5px 15px; border-radius: 14px; font-weight: 600; text-transform: uppercase; border: none; cursor: pointer; transition: background-color 0.3s ease, transform 0.2s ease; font-size: 12px; margin-right: 8px;" [routerLink]="['/doctor/tratamientos', tratamiento.idTratamiento]">
              <i class="pi pi-pencil" style="margin-right: 5px;"></i> Editar
            </button>

            <button pButton icon="pi pi-trash" style="background-color: #d9534f; color: #fff; padding: 5px 15px; border-radius: 14px; font-weight: 600; text-transform: uppercase; border: none; cursor: pointer; transition: background-color 0.3s ease, transform 0.2s ease; font-size: 12px;" (click)="deleteTratamiento(tratamiento.idTratamiento)">
              <i class="pi pi-trash" style="margin-right: 5px;"></i> Eliminar
            </button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <div *ngIf="error" class="error-message" style="color: red; text-align: center; margin-top: 20px;">
    {{ error }}
  </div>
</div>

<div *ngIf="error" class="error-message" style="color: red; text-align: center; margin-top: 20px;">
  {{ error }}
</div>
