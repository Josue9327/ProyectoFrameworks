<header class="vc-header">
  <div class="vc-header__inner">
    <a class="vc-brand" (click)="goToDashboard()" [routerLinkActive]="['active']">
      <span class="vc-logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="28" height="28">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#87BEE0" />
              <stop offset="1" stop-color="#0A3D61" />
            </linearGradient>
          </defs>
          <circle cx="32" cy="32" r="30" fill="url(#g)" />
          <rect x="28" y="14" width="8" height="36" rx="2" fill="#ffffff" opacity="0.9" />
          <rect x="14" y="28" width="36" height="8" rx="2" fill="#ffffff" opacity="0.9" />
        </svg>
      </span>
      <span class="vc-brand__text">VitalCore</span>
    </a>

    <nav class="vc-nav">
      <a (click)="goToInicio()" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>

      <ng-container *ngIf="!isLoggedIn">
        <a routerLink="/login" routerLinkActive="active">Iniciar Sesión</a>
        <a routerLink="/registro" routerLinkActive="active" class="btn-reg">Registrarse</a>
      </ng-container>

      <ng-container *ngIf="isLoggedIn && isPaciente">
        <a routerLink="/paciente/dashboard" routerLinkActive="active">Dashboard</a>
        <a routerLink="/paciente/citas" routerLinkActive="active">Mis Citas</a>
        <a routerLink="/paciente/recetas" routerLinkActive="active">Recetas</a>
        <a routerLink="/paciente/perfil" routerLinkActive="active">Mi Perfil</a>
      </ng-container>

      <ng-container *ngIf="isLoggedIn && isDoctor">
        <a routerLink="/doctor/pacientes" routerLinkActive="active">Pacientes</a>
      </ng-container>

      <div class="user-menu" *ngIf="isLoggedIn">
        <span class="uname">{{ user?.nombre }}</span>
        <button (click)="logout()" class="btn-logout">Salir</button>
      </div>
    </nav>
  </div>
</header>
