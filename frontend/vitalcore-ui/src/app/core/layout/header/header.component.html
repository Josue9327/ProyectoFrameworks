<header class="vc-header">
  <div class="vc-header__inner">
    <a class="vc-brand" routerLink="/">
      <span class="vc-logo" aria-hidden="true">
        <!-- logo circular con cruz (SVG simple) -->
        <svg viewBox="0 0 64 64" width="28" height="28">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#87BEE0"/>
              <stop offset="1" stop-color="#0A3D61"/>
            </linearGradient>
          </defs>
          <circle cx="32" cy="32" r="30" fill="url(#g)"/>
          <rect x="28" y="14" width="8" height="36" rx="2" fill="#ffffff" opacity="0.9"/>
          <rect x="14" y="28" width="36" height="8" rx="2" fill="#ffffff" opacity="0.9"/>
        </svg>
      </span>
      <span class="vc-brand__text">VitalCore</span>
    </a>

    <nav class="vc-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
      <a routerLink="/home" routerLinkActive="active">UI Demo</a>
    </nav>
  </div>
</header>
